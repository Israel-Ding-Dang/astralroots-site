# The sky today (astralroots.app/sky): rewritten every morning by this
# workflow on the site repository, with the same engine bundle the site's
# calculator uses, so the page says what the app's daily sky says. Written
# into the published folder by the site generator in the main repository;
# edit it there, not here.
name: The sky today

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sky
  cancel-in-progress: false

jobs:
  sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute today's sky
        run: node sky/build.mjs
      # The event pins (20 Nov 2026): each new and full moon and Sun season pin
      # is drawn a week before its release, with the runner's own Chrome. If
      # this step fails, the sky and the other pins still go out, and a pin
      # not yet drawn waits in the feeds until a later morning draws it.
      - name: Draw the Pinterest event pins due in the next week
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pins" puppeteer-core@24.43.1
          PUPPETEER_DIR="$RUNNER_TEMP/pins/node_modules/puppeteer-core" CHROME="$(command -v google-chrome || command -v google-chrome-stable)" node sky/pins-draw.mjs
      # A run started by hand also draws the next event pin to come into a
      # temporary folder and keeps nothing, to prove the drawing works here.
      - name: Check the event pin drawing (runs started by hand only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          PUPPETEER_DIR="$RUNNER_TEMP/pins/node_modules/puppeteer-core" CHROME="$(command -v google-chrome || command -v google-chrome-stable)" node sky/pins-draw.mjs --check
      - name: The feeds again, with any pin drawn this morning
        run: node sky/build.mjs
      - name: Commit the sky page, its data, the ritual dates, the Pinterest feeds and event pins if they changed
        run: |
          git add -A -- feeds pins
          if git diff --quiet -- sky rituals && git diff --cached --quiet -- feeds pins; then
            echo "the sky page, its data, the ritual dates, the feeds and the event pins are already today's"
            exit 0
          fi
          git config user.name "the sky today"
          git config user.email "sky@astralroots.app"
          git commit -m "The sky today: $(date -u +%Y-%m-%d)" -- sky rituals feeds pins
          git push
      - name: Ask Pages to build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will build on the push"
